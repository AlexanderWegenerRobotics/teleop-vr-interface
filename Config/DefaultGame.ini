
[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=EFC04E89476832E9D5ED5F80F3CF331A
bStartInVR=True

[/Script/UnrealEd.ProjectPackagingSettings]
; Development, not Shipping. Shipping compiles UE_LOG out by default
; (bUseLoggingInShipping=false), and every diagnostic this project relies on --
; the CONFIG line, ARM_REMOTE_FAULT, the WidgetBinder missing-sink warning, the
; VideoLogger episode summary -- goes through UE_LOG. A collection campaign run
; on a Shipping build produces no engine log at all.
BuildConfiguration=PPBC_Development

; Files the game opens by absolute path at runtime rather than as cooked
; assets. The cooker has no idea they exist, so without these entries they are
; simply absent from the package -- which is why the configs had to be copied
; in by hand last time.
;
;   Config/TeleOp    FPaths::ProjectDir() / "Config/TeleOp/config.json"
;                    (UTeleOpConfig; config.json then names its siblings
;                    relative to its own directory, so the whole folder goes)
;   ThirdParty/ffmpeg FPaths::ProjectDir() / "ThirdParty/ffmpeg/ffmpeg.exe"
;                    (FindFfmpeg in VideoEncoderWrapper.cpp; falls back to bare
;                    "ffmpeg" on PATH, so a missing binary does not error --
;                    video logging just silently produces empty mp4s)
;
; NonUFS means they stage as loose files next to the .pak rather than inside
; it, so the JSONs stay editable in the packaged build without a repackage.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Config/TeleOp")
+DirectoriesToAlwaysStageAsNonUFS=(Path="ThirdParty/ffmpeg")
;   ThirdParty/voice_annotator
;                    UVoiceAnnotatorComponent::VoiceScriptPath, resolved
;                    against FPaths::ProjectDir(). The conda interpreter it is
;                    launched with stays a machine dependency and cannot be
;                    staged; see that folder's README.
+DirectoriesToAlwaysStageAsNonUFS=(Path="ThirdParty/voice_annotator")

